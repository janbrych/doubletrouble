<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epická Hudební Zóna</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            z-index: 1;
            width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 3rem;
            font-style: italic;
        }

        .audio-player-container {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .track {
            margin-bottom: 2.5rem;
            text-align: left;
        }

        .track:last-child {
            margin-bottom: 0;
        }

        .track h3 {
            margin-top: 0;
            margin-bottom: 0.8rem;
            color: #fff;
            font-weight: 300;
            letter-spacing: 0.1rem;
            border-left: 3px solid #cc0000;
            padding-left: 1rem;
        }

        audio {
            width: 100%;
            height: 40px;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
            margin-bottom: 0.5rem;
        }

        .attribution {
            font-size: 0.75rem;
            color: #666;
            margin: 0;
        }

        .attribution a {
            color: #888;
            text-decoration: none;
        }

        .attribution a:hover {
            text-decoration: underline;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            opacity: 0.1;
            z-index: 0;
            filter: grayscale(100%);
        }

        footer {
            margin-top: 3rem;
            color: #444;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; letter-spacing: 0.2rem; }
            .audio-player-container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <h1>EPIC MOMENTS</h1>
        <p class="subtitle">Zažij sílu kinematografické hudby</p>

        <div class="audio-player-container">
            <div class="track">
                <h3>In Dreams</h3>
                <audio controls>
                    <source src="music/in_dreams.mp3" type="audio/mpeg">
                    Váš prohlížeč nepodporuje element audio.
                </audio>
                <p class="attribution">'In Dreams' by Scott Buckley - released under CC-BY 4.0. <a href="https://www.scottbuckley.com.au" target="_blank">www.scottbuckley.com.au</a></p>
            </div>

            <div class="track">
                <h3>The Summoning</h3>
                <audio controls>
                    <source src="music/the_summoning.mp3" type="audio/mpeg">
                    Váš prohlížeč nepodporuje element audio.
                </audio>
                <p class="attribution">'The Summoning' by Scott Buckley - released under CC-BY 4.0. <a href="https://www.scottbuckley.com.au" target="_blank">www.scottbuckley.com.au</a></p>
            </div>
        </div>

        <footer>
            Vytvořeno pro epické zážitky.
        </footer>
    </div>
</body>
</html>
