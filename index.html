<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epická Hudební Zóna</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        p {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .playlist-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            width: 100%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.1);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .playlist-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            opacity: 0.15;
            z-index: 0;
            filter: grayscale(100%);
        }

        footer {
            margin-top: 3rem;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <h1>EPIC MOMENTS</h1>
        <p>Zažij sílu kinematografické hudby</p>

        <div class="playlist-wrapper">
            <!-- YouTube Playlist: Epic Cinematic Music -->
            <iframe
                src="https://www.youtube.com/embed/videoseries?list=PL3-sRm86SshZk9XkP9-YqU2P-n_yS5-0N"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <footer>
            Vytvořeno pro epické zážitky.
        </footer>
    </div>
</body>
</html>
